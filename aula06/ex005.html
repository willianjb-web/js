<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos com DOM</title>
    <style>
        body {
            background-color: rgb(61, 61, 252);
            color: white;
            font: normal 18pt arial;
        }
    </style>
</head>
<body>
    <h1>Iniciando estudos com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p class="pr">Aprendendo a usar o <strong>Dom</strong> em JavaScript.</p>
    <div id="msg">Clique em mim</div>
    <script>
        var corpo = window.document.body
        var p1 = window.document.getElementsByTagName('p')[0]
        var d = window.document.getElementById('msg')
        var p = window.document.getElementsByClassName('pr')
        window.document.write('Está escrito assim: ' + p1.innerText)
        corpo.style.background = 'green'
        p1.style.color = 'black'
        window.alert(p1.innerHTML)
        d.style.background = 'blue'
        d.innerText = 'Estou aguardando...'
        var p = window.document.querySelector('p.pr')// id = # / class = .
        d.style.background = 'blue'
    </script>
</body>
</html>
